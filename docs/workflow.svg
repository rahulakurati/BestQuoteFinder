<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title Section -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700" letter-spacing="1">BESTQUOTE FINDER - ARCHITECTURE &amp; WORKFLOW</text>
  <text x="550" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Automated Multi-Channel Service Discovery, Outreach &amp; Comparison Matrix</text>

  <!-- User Intake Box -->
  <g transform="translate(425, 100)" filter="url(#shadow)">
    <rect width="250" height="70" rx="12" fill="url(#gradBlue)" stroke="#60a5fa" stroke-width="2"/>
    <text x="125" y="30" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">1. Problem Intake &amp; RFQ Spec</text>
    <text x="125" y="52" text-anchor="middle" fill="#dbeafe" font-size="12">ZIP, Photos, Symptoms, Urgency</text>
  </g>

  <!-- Arrow down -->
  <path d="M 550 170 L 550 205" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Multi-Source Discovery Box -->
  <rect x="50" y="210" width="1000" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="235" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700" letter-spacing="0.5">2. MULTI-SOURCE DISCOVERY &amp; PROMO SCOUT</text>

  <!-- Google Places / Search -->
  <g transform="translate(80, 255)">
    <rect width="210" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Google Local &amp; Maps</text>
    <text x="105" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Top-Rated Local Providers</text>
    <text x="105" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">Reviews, Rating, Contacts</text>
  </g>

  <!-- Promo & Coupon Finder -->
  <g transform="translate(320, 255)">
    <rect width="210" height="85" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="105" y="30" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">Promo &amp; Coupon Finder</text>
    <text x="105" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Web Specials &amp; Vouchers</text>
    <text x="105" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">$ Off Diagnostic Fees</text>
  </g>

  <!-- Thumbtack Scout -->
  <g transform="translate(560, 255)">
    <rect width="210" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="105" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Thumbtack Hub</text>
    <text x="105" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Direct Project Deep-Link</text>
    <text x="105" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">Lead Sourcing</text>
  </g>

  <!-- Facebook Marketplace -->
  <g transform="translate(800, 255)">
    <rect width="210" height="85" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="105" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Facebook Marketplace</text>
    <text x="105" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Local Groups &amp; Services</text>
    <text x="105" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">Independent Pros</text>
  </g>

  <!-- Arrow down to Outreach -->
  <path d="M 550 360 L 550 395" stroke="#60a5fa" stroke-width="3" fill="none"/>

  <!-- Outreach & Dispatch Engine -->
  <rect x="180" y="400" width="740" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="425" text-anchor="middle" fill="#10b981" font-size="15" font-weight="700">3. DISPATCH &amp; OUTREACH ENGINE</text>

  <!-- Phase 1: Email Outreach -->
  <g transform="translate(210, 440)">
    <rect width="230" height="55" rx="8" fill="url(#gradGreen)"/>
    <text x="115" y="24" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">PHASE 1: Email Outreach</text>
    <text x="115" y="42" text-anchor="middle" fill="#d1fae5" font-size="11">SMTP / RFQ Tracking Codes</text>
  </g>

  <!-- Phase 2: Google Messages -->
  <g transform="translate(460, 440)">
    <rect width="210" height="55" rx="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="105" y="24" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">PHASE 2: Google Messages</text>
    <text x="105" y="42" text-anchor="middle" fill="#64748b" font-size="11">RCS / SMS Pairing (Pending)</text>
  </g>

  <!-- Phase 2: AI Voice Bot -->
  <g transform="translate(690, 440)">
    <rect width="200" height="55" rx="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="100" y="24" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">PHASE 2: Voice Calls</text>
    <text x="100" y="42" text-anchor="middle" fill="#64748b" font-size="11">Vapi / Retell Phone Assistant</text>
  </g>

  <!-- Arrow down to Ingestion & Matrix -->
  <path d="M 550 510 L 550 545" stroke="#60a5fa" stroke-width="3" fill="none"/>

  <!-- Ingestion & Comparison Matrix -->
  <g transform="translate(250, 550)" filter="url(#shadow)">
    <rect width="600" height="110" rx="16" fill="url(#gradPurple)" stroke="#a78bfa" stroke-width="2"/>
    <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">4. QUOTE PARSING &amp; COMPARISON MATRIX</text>
    <text x="300" y="58" text-anchor="middle" fill="#e9d5ff" font-size="13">Structured Extraction: Diagnostic Fee | Repair Range | Availability | Warranty</text>
    <text x="300" y="85" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Decision Badges: [Best Overall Value] [Fastest Fix] [Lowest Diagnostic]</text>
  </g>
</svg>
